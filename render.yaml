services:
  - type: web
    name: sms-fraud-detector-backend
    runtime: python
    rootDir: be
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn be.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: sms-fraud-detector-backend.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://sms-fraud-detector-backend.onrender.com
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: FRONTEND_URL
        value: https://your-frontend-domain.com
      - key: FRONTEND_LOGIN_URL
        value: https://your-frontend-domain.com/login

databases:
  - name: sms-fraud-detector-db
    plan: free